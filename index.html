<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEBA CarWash 4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy-950:#071019;
    --navy-900:#0b1b2b;
    --navy-800:#122840;
    --navy-700:#1a3654;
    --line:#22405f;
    --ice:#eaf3fb;
    --mist:#9fb6cc;
    --aqua:#26c6da;
    --blue:#2e9bf0;
    --blue-dim:#1c6fb0;
    --teal:#1fbf8f;
    --amber:#f0a63a;
    --coral:#f0665a;
    --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background: radial-gradient(1200px 700px at 85% -10%, #0d2740 0%, var(--navy-950) 55%);
    color:var(--ice);
    min-height:100vh;
    display:flex;
  }
  h1,h2,h3,.brand{font-family:'Sora',sans-serif;}
  .sidebar{
    width:230px; flex-shrink:0;
    background:var(--navy-900);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    padding:24px 16px;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .brand .drop{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg, var(--blue), var(--aqua));
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }
  .brand .name{font-weight:700; font-size:16px; line-height:1.1;}
  .brand .name span{display:block; font-size:10px; color:var(--aqua); font-weight:600; letter-spacing:.08em;}
  .nav{margin-top:32px; display:flex; flex-direction:column; gap:4px;}
  .nav button{
    all:unset; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px;
    color:var(--mist); font-size:14px; font-weight:500;
    transition:background .15s, color .15s;
  }
  .nav button:hover{background:var(--navy-800); color:var(--ice);}
  .nav button.active{background:var(--navy-800); color:var(--ice); box-shadow:inset 3px 0 0 var(--aqua);}
  .nav button .ico{width:18px; text-align:center; font-size:15px;}
  .sidebar-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--line); font-size:11px; color:var(--mist);}
  .main{flex:1; padding:28px 34px; max-width:1180px;}
  .view{display:none;}
  .view.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:26px;}
  .topbar h1{font-size:22px; font-weight:700;}
  .topbar .sub{color:var(--mist); font-size:13px; margin-top:4px;}
  .date-pill{
    background:var(--navy-800); border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; font-size:12px; color:var(--mist);
  }
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1.4fr 1fr;}
  .card{
    background:var(--navy-900); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px;
  }
  .stat-label{font-size:11.5px; color:var(--mist); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;}
  .stat-value{font-size:26px; font-weight:700; font-family:'Sora',sans-serif;}
  .stat-value.aqua{color:var(--aqua);}
  .stat-value.blue{color:var(--blue);}
  .stat-value.teal{color:var(--teal);}
  .stat-value.amber{color:var(--amber);}
  .stat-note{font-size:11.5px; color:var(--mist); margin-top:6px;}
  .section-title{font-size:14px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;}
  .section-title .link{font-size:12px; color:var(--aqua); cursor:pointer; font-weight:500;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--mist); font-weight:500; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:10px 10px; border-bottom:1px solid var(--navy-800); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600;}
  .tag.moto{background:#1a3654; color:#7fb8ea;}
  .tag.carro{background:#173a33; color:#4fd1a5;}
  .tag.camioneta{background:#3a2f16; color:#f0c14a;}
  .tag.completo{background:#123a4a; color:var(--aqua);}
  .row-actions{display:flex; gap:8px;}
  .row-actions button{
    all:unset; cursor:pointer; font-size:12px; color:var(--mist);
    padding:4px 8px; border-radius:6px; border:1px solid var(--line);
  }
  .row-actions button:hover{color:var(--ice); border-color:var(--aqua);}
  .row-actions button.danger:hover{color:var(--coral); border-color:var(--coral);}
  label{display:block; font-size:11.5px; color:var(--mist); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  input, select{
    width:100%; background:var(--navy-800); border:1px solid var(--line); color:var(--ice);
    padding:10px 12px; border-radius:9px; font-size:14px; font-family:'Inter',sans-serif;
  }
  input:focus, select:focus{outline:none; border-color:var(--aqua);}
  .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  .service-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .service-opt{
    border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .service-opt:hover{border-color:var(--blue-dim);}
  .service-opt.selected{border-color:var(--aqua); background:#0f2b3d;}
  .service-opt .sname{font-size:13.5px; font-weight:500;}
  .service-opt .sprice{font-size:13.5px; font-weight:700; color:var(--aqua);}
  .photo-box{
    border:1.5px dashed var(--line); border-radius:10px; padding:20px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:var(--mist); font-size:12.5px; margin-bottom:18px; cursor:pointer;
    text-align:center;
  }
  .photo-box.has-photo{border-style:solid; border-color:var(--aqua); color:var(--ice);}
  .photo-box img{max-height:70px; border-radius:6px;}
  .summary-box{display:flex; gap:12px; margin-bottom:18px;}
  .summary-box .card{flex:1; text-align:left;}
  .btn{
    all:unset; cursor:pointer; text-align:center; font-weight:600; font-size:14px;
    padding:12px 18px; border-radius:10px; font-family:'Inter',sans-serif;
  }
  .btn-primary{background:linear-gradient(135deg, var(--blue), var(--aqua)); color:#04141f;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{border:1px solid var(--line); color:var(--mist);}
  .btn-ghost:hover{color:var(--ice); border-color:var(--mist);}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn-ghost{flex:1;} .btn-row .btn-primary{flex:2;}
  .search-bar{display:flex; gap:10px; margin-bottom:16px;}
  .search-bar input{flex:1;}
  .empty{text-align:center; padding:40px 0; color:var(--mist); font-size:13px;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy-800); border:1px solid var(--aqua); color:var(--ice);
    padding:12px 20px; border-radius:10px; font-size:13px; opacity:0;
    transition:opacity .25s, transform .25s; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .split-pill{display:flex; align-items:center; gap:8px; background:var(--navy-800); border:1px solid var(--line); border-radius:999px; padding:6px 6px 6px 14px; font-size:12px;}
  .split-pill b{color:var(--aqua);}
  .chart-wrap{position:relative; height:220px;}
  .modal-bg{position:fixed; inset:0; background:rgba(4,10,17,.6); display:none; align-items:center; justify-content:center; z-index:60;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--navy-900); border:1px solid var(--line); border-radius:14px; padding:22px; width:360px;}
  .modal h3{font-size:15px; margin-bottom:14px;}
  @media (max-width: 480px){
    body{ flex-direction:column; }
    .sidebar{
      width:100%; height:auto; position:static;
      flex-direction:row; align-items:center; justify-content:space-between;
      padding:12px 14px; overflow-x:auto;
    }
    .sidebar .brand{ display:none; }
    .sidebar-foot{ display:none; }
    .nav{ flex-direction:row; margin-top:0; gap:2px; }
    .nav button{ flex-direction:column; font-size:10px; padding:8px 6px; gap:2px; white-space:nowrap; }
    .nav button .ico{ font-size:18px; }
    .main{ padding:16px; max-width:100%; }
    .topbar h1{ font-size:18px; }
    .grid-4{ grid-template-columns:repeat(2,1fr); }
    .grid-2{ grid-template-columns:1fr; }
    .stat-value{ font-size:20px; }
    table{ font-size:11.5px; }
    th, td{ padding:6px 4px; }
    .service-grid{ grid-template-columns:1fr; }
    .field-row{ grid-template-columns:1fr; }
    .summary-box{ flex-direction:column; }
    .btn-row{ flex-direction:column; }
    .section-title{ flex-wrap:wrap; gap:8px; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <div class="drop">🚿</div>
    <div class="name">Seba CarWash<span>CONTROL Y GANANCIAS</span></div>
  </div>
  <nav class="nav">
    <button class="active" data-view="inicio"><span class="ico">⌂</span> Inicio</button>
    <button data-view="nuevo"><span class="ico">＋</span> Nuevo lavado</button>
    <button data-view="historial"><span class="ico">☰</span> Historial</button>
    <button data-view="reportes"><span class="ico">▤</span> Reportes</button>
    <button data-view="pago"><span class="ico">$</span> Pago móvil</button>
  </nav>
  <div class="sidebar-foot">Comisión configurada: <b style="color:var(--ice)">40%</b>, dividida entre 2 trabajadores.</div>
</div>

<div class="main">

  <!-- INICIO -->
  <section class="view active" id="view-inicio">
    <div class="topbar">
      <div>
        <h1>Hola, Sebastián</h1>
        <div class="sub">Resumen de hoy</div>
      </div>
      <div class="date-pill" id="today-pill"></div>
    </div>

    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="card">
        <div class="stat-label">Total vendido hoy</div>
        <div class="stat-value aqua" id="stat-total">$0.00</div>
      </div>
      <div class="card">
        <div class="stat-label">Comisión (40%)</div>
        <div class="stat-value blue" id="stat-comision">$0.00</div>
      </div>
      <div class="card">
        <div class="stat-label">Por trabajador (÷2)</div>
        <div class="stat-value teal" id="stat-porpersona">$0.00</div>
      </div>
      <div class="card">
        <div class="stat-label">Servicios hoy</div>
        <div class="stat-value amber" id="stat-servicios">0</div>
      </div>
    </div>

    <div class="grid grid-2">
